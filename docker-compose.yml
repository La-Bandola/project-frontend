services:
  backend:
    build: ./project-backend
    restart: unless-stopped
    command: >
      sh -c "
        until python manage.py migrate --no-input; do
          echo 'Neon está despertando, reintentando en 3s...';
          sleep 3;
        done &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./project-backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./project-frontend
    command: npm run dev -- --host
    volumes:
      - ./project-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  media_data: